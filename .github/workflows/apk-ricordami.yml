name: APK RicordaMi

# Costruisce l'APK di prova a ogni modifica di ricordami/ (e a mano da Actions → Run workflow).
# Si scarica da: Actions → "APK RicordaMi" → l'esecuzione → Artifacts.
on:
  push:
    paths: ['ricordami/**', '.github/workflows/apk-ricordami.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ricordami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Compila l'APK
        working-directory: ricordami/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nome con la versione
        run: |
          V=$(node -e "import('./js/marchio.js').then(m => console.log(m.MARCHIO.versione))")
          cp android/app/build/outputs/apk/debug/app-debug.apk "RicordaMi-$V-prova.apk"
          echo "VERSIONE=$V" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: RicordaMi-${{ env.VERSIONE }}-prova
          path: ricordami/RicordaMi-*-prova.apk
          retention-days: 30
