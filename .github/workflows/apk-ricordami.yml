name: APK RicordaMi

# Costruisce l'APK a ogni modifica di ricordami/ (e a mano da Actions → Run workflow).
# Quando in js/novita.js c'è una versione nuova, crea anche la release su GitHub:
# le app installate la vedono e propongono l'aggiornamento.
on:
  push:
    paths: ['ricordami/**', '.github/workflows/apk-ricordami.yml']
  workflow_dispatch:

permissions:
  contents: write # per pubblicare la release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ricordami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Compila l'APK
        working-directory: ricordami/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nome con la versione
        run: |
          V=$(node scripts/rilascio.mjs versione)
          cp android/app/build/outputs/apk/debug/app-debug.apk "RicordaMi-$V.apk"
          echo "VERSIONE=$V" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: RicordaMi-${{ env.VERSIONE }}
          path: ricordami/RicordaMi-*.apk
          retention-days: 30
      - name: Pubblica la release (solo se la versione è nuova)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node scripts/rilascio.mjs tag)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG esiste già: niente da pubblicare."
          else
            node scripts/rilascio.mjs testo "RicordaMi-$VERSIONE.apk" > note.md
            gh release create "$TAG" "RicordaMi-$VERSIONE.apk" --title "RicordaMi $VERSIONE" --notes-file note.md --target "$GITHUB_SHA"
          fi
